<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="570" height="420" viewBox="0 0 570 420" role="img" aria-label="PSR.ai full workflow symbol">
<title>PSR.ai full workflow symbol</title><defs>
     <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FCFE"/><stop offset="0.50" stop-color="#ECF2F5"/><stop offset="1" stop-color="#D4E1E9"/></linearGradient>
     <linearGradient id="screen-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38C3EF"/><stop offset="0.58" stop-color="#078FCE"/><stop offset="1" stop-color="#0564B2"/></linearGradient>
     <linearGradient id="screen-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#068B91"/><stop offset="1" stop-color="#10C68A"/></linearGradient>
     <linearGradient id="node-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#058DC9"/><stop offset="1" stop-color="#00618A"/></linearGradient>
     <linearGradient id="node-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16C4EB"/><stop offset="1" stop-color="#008CAB"/></linearGradient>
     <linearGradient id="node-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17C5A8"/><stop offset="1" stop-color="#007A63"/></linearGradient>
     <linearGradient id="record" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6564"/><stop offset="0.56" stop-color="#F12A30"/><stop offset="1" stop-color="#B80009"/></linearGradient>
     <linearGradient id="night-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#153C5C"/><stop offset="0.58" stop-color="#0B2C4A"/><stop offset="1" stop-color="#05152C"/></linearGradient>
     <clipPath id="window-clip"><rect x="52" y="129" width="151" height="155" rx="6"/></clipPath>
     </defs><g aria-label="Steps recorder with three connected AI workflow nodes">
