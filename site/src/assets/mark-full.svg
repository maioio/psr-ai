    <path d="M335 175H351 Q388 175 388 122V111 Q388 76 424 76H446" fill="none" stroke="url(#node-blue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M335 219H410 Q428 219 443 202 Q456 190 473 190H483" fill="none" stroke="url(#node-cyan)" stroke-width="18" stroke-linecap="round"/>
    <path d="M335 266H353 Q391 266 392 311 Q394 351 432 351H446" fill="none" stroke="url(#node-green)" stroke-width="18" stroke-linecap="round"/>
    <!-- Terminal nodes -->
    <rect x="437" y="31" width="86" height="88" rx="18" fill="url(#node-blue)"/>
    <rect x="450" y="44" width="60" height="60" rx="10" fill="#FAFDFF"/>
    <rect x="479" y="161" width="84" height="90" rx="18" fill="url(#node-cyan)"/>
    <rect x="492" y="175" width="58" height="61" rx="10" fill="#20BDEB"/>
    <rect x="441" y="305" width="86" height="90" rx="18" fill="url(#node-green)"/>
    <rect x="454" y="319" width="60" height="61" rx="10" fill="#FCFEFF"/>
    <!-- Subtle vector drop shadow -->
    <rect x="16" y="100" width="320" height="233" rx="24" fill="#17364C" opacity=".10"/>
    <rect x="13" y="93" width="318" height="234" rx="25" fill="url(#frame)" stroke="#4A697D" stroke-width="5"/>
    <rect x="23" y="104" width="298" height="211" rx="19" fill="#FCFEFF" stroke="#7391A1" stroke-width="4"/>
    <rect x="36" y="116" width="274" height="188" rx="11" fill="#F4F8FA"/>
    <!-- Two-tone screen -->
    <rect x="48" y="125" width="159" height="163" rx="8" fill="#387890"/>
    <g clip-path="url(#window-clip)">
      <rect x="52" y="129" width="151" height="83" fill="url(#screen-blue)"/>
      <rect x="52" y="212" width="151" height="72" fill="url(#screen-green)"/>
      <path d="M52 190L165 129H203L52 270Z" fill="#64E7EF" opacity=".10"/>
      <path d="M52 284L146 212H203V284Z" fill="#35E4B0" opacity=".15"/>
    </g>
    <rect x="52" y="129" width="151" height="155" rx="6" fill="none" stroke="#0E7B98" stroke-width="3"/>
    <!-- Three step lines -->
    <rect x="224" y="132" width="72" height="16" rx="5" fill="#7D9AAA" opacity=".50"/>
    <rect x="227" y="134" width="66" height="11" rx="4" fill="#B6CDD9"/>
    <rect x="224" y="162" width="72" height="16" rx="5" fill="#7D9AAA" opacity=".50"/>
    <rect x="227" y="164" width="66" height="11" rx="4" fill="#B6CDD9"/>
    <rect x="224" y="192" width="72" height="16" rx="5" fill="#7D9AAA" opacity=".50"/>
    <rect x="227" y="194" width="66" height="11" rx="4" fill="#B6CDD9"/>
    <!-- Record dot -->
    <circle cx="261" cy="264" r="31" fill="#97090D"/>
    <circle cx="261" cy="260" r="28" fill="url(#record)"/>
    <circle cx="253" cy="249" r="11" fill="#FFA7A3" opacity=".25"/>
    </g></svg>