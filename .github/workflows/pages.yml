name: Deploy Pages

# Builds the tracked Astro site in site/ and publishes site/dist.
# The base path /psr-ai is set in site/astro.config.mjs.
# Nothing deploys unless the site's counts match the committed code and the
# built site passes validate_site_build.py.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'data/public-product-facts.json'
      - 'scripts/public_surface/**'
      - 'pyproject.toml'
      - 'src/psr_ai/cli.py'
      - 'src/psr_ai/mcp.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Check public facts against the code
        run: python scripts/public_surface/product_facts.py --check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Validate built site
        run: python scripts/public_surface/validate_site_build.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
