[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psr-ai"
version = "0.2.0"
description = "AI-native CLI wrapper for Windows Steps Recorder (PSR.exe)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["psr", "windows", "screenshot", "ai-agent", "workflow", "mht", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

# Runtime: only click is required.
# Pillow is optional but recommended on Windows: it powers GIF generation
# (sa stop / sa pub --gif) and the in-memory frame de-duplication used by the
# polling fallback recorder. Without it the fallback still records - via the
# native OS screenshot tool - but cannot discard idle frames.
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
cloud   = ["aiohttp>=3.9"]
gif     = ["Pillow>=10.0"]
record  = ["Pillow>=10.0", "pynput>=1.7"]
ai      = ["anthropic>=0.25", "openai>=1.0"]
desktop = ["pynput>=1.7"]
agent   = ["pyautogui>=0.9.54", "Pillow>=10.0", "anthropic>=0.25"]
capture  = ["playwright>=1.40", "pypdf>=4.0"]
download = ["yt-dlp>=2024.1", "gallery-dl>=1.27"]
instagram = ["instagrapi>=2.0"]
analyze  = ["faster-whisper>=1.0", "yt-dlp>=2024.1"]
analyze-legacy = ["openai-whisper>=20231117", "yt-dlp>=2024.1"]
full = [
    "anthropic>=0.25",
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
    "Pillow>=10.0",
    "playwright>=1.40",
    "pynput>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "Pillow>=10.0",
]

# The `sa` console script maps directly to psr_ai.cli:main.
# After `pip install -e .` on Windows, run:
#   $env:PATH += ";$env:LOCALAPPDATA\Python\<version>\Scripts"
# if `sa` is not found immediately after install.
[project.scripts]
sa = "psr_ai.cli:main"

[project.urls]
Homepage    = "https://github.com/maioio/psr-ai"
Issues      = "https://github.com/maioio/psr-ai/issues"
Source      = "https://github.com/maioio/psr-ai"
Changelog   = "https://github.com/maioio/psr-ai/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Ship the companion Chrome extension inside the wheel so `sa context install`
# can point at a real directory on any machine, source checkout or pip install.
[tool.setuptools.package-data]
"psr_ai" = ["extension/*.json", "extension/*.js", "extension/*.html", "extension/*.png"]

[tool.setuptools.data-files]
# Ship the fallback .lnk asset alongside the package.
"psr_ai_assets" = ["assets/psr_fallback/psr_shortcut.lnk",
                   "assets/psr_fallback/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["src/psr_ai"]
omit   = ["tests/*"]
